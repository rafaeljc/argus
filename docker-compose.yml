services:
  postgres:
    image: postgres:18-alpine
    container_name: argus-postgres
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - "5432:5432"
    volumes:
      - argus-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.14
    container_name: argus-swagger-ui
    environment:
      SWAGGER_JSON: /spec/argus-v1.yaml
    volumes:
      - ./contracts/openapi:/spec:ro
    ports:
      - "127.0.0.1:9090:8080"

volumes:
  argus-pg-data:
