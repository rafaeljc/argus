name: CD Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (defaults to the latest on main)'
        required: false

concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # One parameter at a time: a bulk read succeeds on a partial result, and a
      # missing value would then surface as an empty bucket name.
      - name: Read infrastructure outputs
        id: infra
        run: |
          set -euo pipefail
          bucket_name=$(aws ssm get-parameter --name /argus/prod/out/frontend/bucket-name --query Parameter.Value --output text)
          distribution_id=$(aws ssm get-parameter --name /argus/prod/out/frontend/distribution-id --query Parameter.Value --output text)
          {
            echo "bucket_name=$bucket_name"
            echo "distribution_id=$distribution_id"
          } >> "$GITHUB_OUTPUT"

      - name: Upload hashed assets with a long-lived cache
        run: |
          aws s3 sync dist/ "s3://${{ steps.infra.outputs.bucket_name }}/" --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --exclude index.html

      - name: Upload index.html uncached
        run: |
          aws s3 cp dist/index.html "s3://${{ steps.infra.outputs.bucket_name }}/index.html" \
            --cache-control 'no-cache' --content-type 'text/html'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution_id }}" --paths '/*'
