name: CD Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (defaults to the latest on main)'
        required: false

concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name Argus-Prod \
            --query 'Stacks[0].Outputs' --output json)
          for name in BucketName DistributionId; do
            value=$(echo "$OUTPUTS" | jq -r --arg n "$name" '.[] | select(.OutputKey | contains($n)) | .OutputValue')
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Upload hashed assets with a long-lived cache
        run: |
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.BucketName }}/" --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --exclude index.html

      - name: Upload index.html uncached
        run: |
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.BucketName }}/index.html" \
            --cache-control 'no-cache' --content-type 'text/html'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.DistributionId }}" --paths '/*'
