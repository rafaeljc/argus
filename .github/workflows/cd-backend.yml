name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (defaults to the latest on main)'
        required: false

concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target SHA
        id: target
        run: echo "sha=${{ inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Read one parameter at a time, deliberately. get-parameters and
      # get-parameters-by-path both succeed on a partial result, so a missing
      # value would surface later as an empty argument rather than here.
      - name: Read infrastructure outputs
        id: infra
        run: |
          set -euo pipefail
          repository_uri=$(aws ssm get-parameter --name /argus/prod/out/backend/repository-uri --query Parameter.Value --output text)
          cluster_name=$(aws ssm get-parameter --name /argus/prod/out/backend/cluster-name --query Parameter.Value --output text)
          service_name=$(aws ssm get-parameter --name /argus/prod/out/backend/service-name --query Parameter.Value --output text)
          task_definition_family=$(aws ssm get-parameter --name /argus/prod/out/backend/task-definition-family --query Parameter.Value --output text)
          container_name=$(aws ssm get-parameter --name /argus/prod/out/backend/container-name --query Parameter.Value --output text)
          {
            echo "repository_uri=$repository_uri"
            echo "cluster_name=$cluster_name"
            echo "service_name=$service_name"
            echo "task_definition_family=$task_definition_family"
            echo "container_name=$container_name"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.infra.outputs.repository_uri }}:${{ steps.target.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point SSM at this SHA
        run: |
          aws ssm put-parameter --name /argus/prod/image-tag \
            --value "${{ steps.target.outputs.sha }}" --overwrite

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ steps.infra.outputs.task_definition_family }}
          container-name: ${{ steps.infra.outputs.container_name }}
          image: ${{ steps.infra.outputs.repository_uri }}:${{ steps.target.outputs.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ steps.infra.outputs.cluster_name }}
          service: ${{ steps.infra.outputs.service_name }}
          wait-for-service-stability: true

      # Every deploy registers a revision and AWS never removes them, so they
      # accumulate outside CloudFormation's view forever.
      - name: Deregister superseded task definitions
        run: |
          set -euo pipefail
          superseded=$(aws ecs list-task-definitions \
            --family-prefix "${{ steps.infra.outputs.task_definition_family }}" \
            --status ACTIVE --sort DESC \
            --query 'taskDefinitionArns[10:]' --output text)
          if [ -z "$superseded" ] || [ "$superseded" = "None" ]; then
            echo "Nothing to deregister."
            exit 0
          fi
          for arn in $superseded; do
            aws ecs deregister-task-definition --task-definition "$arn" >/dev/null
            echo "Deregistered $arn"
          done
