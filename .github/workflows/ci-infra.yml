name: CI Infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yml'

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: infra
        run: ruff check .

      - name: Check formatting
        working-directory: infra
        run: ruff format --check .

      - name: Type check
        working-directory: infra
        run: mypy .

      - name: pytest
        working-directory: infra
        run: pytest --cov=argus --cov-report=term-missing --cov-fail-under=80
