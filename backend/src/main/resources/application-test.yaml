spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true

management:
  endpoint:
    health:
      show-details: always

argus:
  rate-limit:
    # Authenticated ITs drive real signup/login flows via TestLogin instead of seeding session
    # storage directly. Most of these share one cached Spring context (same PostgresContainer +
    # RedisContainer import), so a full suite run performs far more signups/logins than the
    # production budget allows from one IP-keyed bucket. The "read" and "write" buckets are left
    # at production values — RateLimitIT depends on the "read" capacity.
    buckets:
      "[auth.signup]":
        capacity: 100000
        refill-tokens: 100000
        refill-duration: PT1M
      "[auth.login]":
        capacity: 100000
        refill-tokens: 100000
        refill-duration: PT1M
      "[auth.reset]":
        capacity: 100000
        refill-tokens: 100000
        refill-duration: PT1M
      "[unauth.global]":
        capacity: 100000
        refill-tokens: 100000
        refill-duration: PT1M
