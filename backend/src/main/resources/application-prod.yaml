spring:
  datasource:
    url: ${ARGUS_DB_URL}
    username: ${ARGUS_DB_USER}
    password: ${ARGUS_DB_PASSWORD}
    hikari:
      pool-name: argus-pool

argus:
  email:
    vendor: resend
    # No defaults: a prod boot without vendor credentials, a sender address, or the public host the
    # links point at must fail rather than start up and mail dead links to real users.
    from-address: ${EMAIL_FROM_ADDRESS}
    app-base-url: ${APP_BASE_URL}
    resend:
      api-key: ${EMAIL_API_KEY}
      base-url: ${EMAIL_API_BASE_URL}
  marketdata:
    massive:
      # No defaults: a prod boot without vendor credentials or endpoint must fail rather than
      # start up and discover the gap on the first end-of-day run.
      api-key: ${MARKETDATA_API_KEY}
      base-url: ${MARKETDATA_BASE_URL}
      connect-timeout: 5s
      read-timeout: 30s
      # The symbol sweep is the only paginated call. Bounded so a runaway cursor cannot spin
      # against the vendor indefinitely.
      max-universe-pages: 20

server:
  # Prod runs behind a TLS-terminating LB. `framework` installs ForwardedHeaderFilter so
  # getRemoteAddr() / getScheme() reflect the original client via X-Forwarded-* headers.
  # Only safe in environments with a trusted hop in front — left at default (none) elsewhere
  # so direct clients can't spoof their IP.
  forward-headers-strategy: framework
