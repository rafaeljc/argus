spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/argus
    username: argus
    password: argus
    hikari:
      leak-detection-threshold: 30000
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.rafaeljc.argus: DEBUG
