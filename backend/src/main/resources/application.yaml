spring:
  application:
    name: argus
  mvc:
    servlet:
      path: /api/v1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # Deliberately excludes the vendor breakers, which still report on /actuator/health.
        # Readiness gates the load balancer, so it must answer "can this instance serve traffic?" —
        # this process and the database. A vendor outage degrades a background capability: email
        # stays queued in the outbox for a later poll, and market data falls back to the last cached
        # close. Gating on either would convert that into a total outage across every instance at
        # once, since they all share the same vendor.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@

logging:
  level:
    root: INFO
    io.github.rafaeljc.argus: INFO

resilience4j:
  circuitbreaker:
    instances:
      vendor-email:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      vendor-marketdata:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 30s
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      vendor-email:
        maxAttempts: 3
        # 2s then 4s. The poller sends one message at a time on a 30s tick, so the ladder only has
        # to outlast a brief blip; anything longer is better served by the next tick.
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Whitelist, deliberately: anything absent is terminal. 4xx is about the message — a
        # suppressed or malformed recipient, a rejected key — and never becomes valid by trying
        # again. 429 is absent too: the next poll tick is already the retry, so burning this
        # budget on a rate limit we are respecting would only trip the circuit breaker.
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
      vendor-marketdata:
        maxAttempts: 3
        # 5s then 10s. The vendor's free tier admits roughly one call every 12s, so a sub-second
        # ladder would spend both retries inside the window that rejected the first attempt.
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Spreads retries so the backfill worker and the EOD step don't resynchronise onto the
        # same second after an outage.
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        # Whitelist, deliberately: anything absent is terminal. 401/403 (bad key) and 404 (no such
        # ticker) never become true by trying again, and retrying them only burns vendor quota.
        # 429 is deliberately absent too: the vendor rate-limits the whole account, so a 429 is
        # throttling, not failure — it's retried on vendor-marketdata-throttle's own schedule
        # (MarketdataInfrastructureConfig), not here, so a burst of throttling can't burn this
        # retry's budget and trip the circuit breaker for no reason.
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException

argus:
  email:
    # `noop` logs instead of sending. Set to `resend` — with the credentials below — to reach a real
    # inbox; anything else fails the boot rather than silently swallowing mail.
    vendor: ${EMAIL_VENDOR:noop}
    poll:
      interval-ms: 30000
    resend:
      # Credentials and endpoint are deliberately absent — they are supplied per environment. These
      # two are transport limits, not secrets, so they carry the same value everywhere: without
      # them a stalled vendor connection pins the poller and nothing behind it goes out.
      connect-timeout: 5s
      read-timeout: 30s
  marketdata:
    backfill:
      interval-ms: 60000
  portfolio:
    snapshot-rebuild:
      interval-ms: 60000
  eodpipeline:
    cron: "0 0 17 * * MON-FRI"
  auth:
    session:
      sweep:
        interval-ms: 3600000
  rate-limit:
    # Bucket keys are wrapped in "[...]" so Spring's relaxed binder treats the dots as part of
    # the map key instead of nesting (RL.auth.signup -> RL -> auth -> signup). Do not unquote.
    buckets:
      "[RL.auth.signup]":
        capacity: 5
        refill-tokens: 5
        refill-duration: PT1H
      "[RL.auth.login]":
        capacity: 10
        refill-tokens: 10
        refill-duration: PT15M
      "[RL.auth.reset]":
        capacity: 5
        refill-tokens: 5
        refill-duration: PT1H
      "[RL.unauth.global]":
        capacity: 100
        refill-tokens: 100
        refill-duration: PT1M
      "[RL.read]":
        capacity: 300
        refill-tokens: 300
        refill-duration: PT1M
      "[RL.write]":
        capacity: 60
        refill-tokens: 60
        refill-duration: PT1M
