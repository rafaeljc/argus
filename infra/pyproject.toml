[project]
name = "argus-infra"
version = "0.1.0"
description = "AWS CDK infrastructure for Argus"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["\\.venv", "cdk\\.out"]

[[tool.mypy.overrides]]
module = "aws_cdk.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["argus"]
